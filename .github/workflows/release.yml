name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm tag matches package version
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p 'require("./package.json").version')"
          lockfile_version="$(node -p 'require("./package-lock.json").version ?? ""')"
          lockfile_root_version="$(node -p 'require("./package-lock.json").packages?.[""]?.version ?? ""')"
          expected_tag="v${package_version}"

          if [[ ! "${package_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid package version::Release stopped because package.json version '${package_version}' is not in X.Y.Z format."
            echo "Set package.json to a release version such as 1.1.0, update package-lock.json, and try again." >&2
            exit 1
          fi

          if [[ "${lockfile_version}" != "${package_version}" || "${lockfile_root_version}" != "${package_version}" ]]; then
            echo "::error title=Package version mismatch::Release stopped because package.json is '${package_version}', package-lock.json is '${lockfile_version}', and the lockfile root package is '${lockfile_root_version}'. All three must match."
            echo "Run npm install after changing the version, commit the regenerated package-lock.json, and try again." >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error title=Release version mismatch::Release stopped because tag '${GITHUB_REF_NAME}' does not exactly match package.json version '${package_version}' (expected '${expected_tag}')."
            echo "Update package.json and package-lock.json or push the matching '${expected_tag}' tag, then try again." >&2
            exit 1
          fi

          echo "Release version verified: ${GITHUB_REF_NAME}, package.json, and package-lock.json all agree on ${package_version}."

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: validate-version
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact-name: watchalong-windows
            artifact-path: release/*.exe
            arch-args: ""
            tool-platform: win32
            tool-arch: x64
            node-version: '24.15.0'
          - name: macOS (Intel)
            os: macos-latest
            artifact-name: watchalong-macos-x64
            artifact-path: release/*.dmg
            arch-args: "--mac dmg --x64"
            tool-platform: darwin
            tool-arch: x64
            node-version: '24.16.0'
          - name: macOS (Apple Silicon)
            os: macos-latest
            artifact-name: watchalong-macos-arm64
            artifact-path: release/*.dmg
            arch-args: "--mac dmg --arm64"
            tool-platform: darwin
            tool-arch: arm64
            node-version: '24.16.0'

    env:
      WATCHALONG_TARGET_PLATFORM: ${{ matrix.tool-platform }}
      WATCHALONG_TARGET_ARCH: ${{ matrix.tool-arch }}
      WATCHALONG_TARGET_NODE_VERSION: ${{ matrix.node-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Verify bundled tool provenance
        run: npm run verify:tool-provenance

      - name: Make macOS tools executable
        if: runner.os == 'macOS'
        run: chmod +x resources/tools/ffmpeg/ffmpeg-darwin-* resources/tools/ffmpeg/ffprobe-darwin-* resources/tools/node/node-darwin-* resources/tools/yt-dlp/yt-dlp_macos

      - name: Install dependencies
        run: npm ci

      - name: Build distribution
        run: npm run dist -- ${{ matrix.arch-args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  windows-source-bundle:
    name: Build Windows FFmpeg source bundle
    runs-on: ubuntu-latest
    needs: validate-version
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Verify Windows source-bundle inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool scripts/ffmpeg-windows-source-inputs.json >/dev/null
          bash -n scripts/build-windows-ffmpeg.sh
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { parseToolProvenance } from './scripts/tool-provenance.mjs'

          const sourceManifest = JSON.parse(
            readFileSync('scripts/ffmpeg-windows-source-inputs.json', 'utf8')
          )
          const provenance = parseToolProvenance(readFileSync('TOOL_PROVENANCE.md', 'utf8'))
          const provenanceByPath = new Map(provenance.map((entry) => [entry.path, entry.sha256]))

          for (const output of sourceManifest.outputs) {
            const provenanceHash = provenanceByPath.get(output.path)
            if (provenanceHash !== output.sha256) {
              throw new Error(
                `Windows source manifest hash for ${output.path} (${output.sha256}) ` +
                `does not match TOOL_PROVENANCE.md (${provenanceHash ?? 'missing'})`
              )
            }
          }
          console.log('Windows source manifest and tool provenance hashes agree.')
          NODE

      - name: Build Windows FFmpeg and corresponding source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-windows-ffmpeg.sh \
            --work-dir "${RUNNER_TEMP}/ffmpeg-windows-build" \
            --output-dir "${RUNNER_TEMP}/ffmpeg-windows-output" \
            --jobs "$(nproc)"

      - name: Name Windows corresponding-source artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ffmpeg-source-assets"
          shopt -s nullglob
          source_bundles=("${RUNNER_TEMP}/ffmpeg-windows-output"/*.tar.xz)
          if [[ "${#source_bundles[@]}" -ne 1 || ! -f "${source_bundles[0]}" ]]; then
            echo "Expected exactly one Windows FFmpeg source bundle; found ${#source_bundles[@]}." >&2
            exit 1
          fi
          cp -- "${source_bundles[0]}" \
            "${RUNNER_TEMP}/ffmpeg-source-assets/WatchAlong-${GITHUB_REF_NAME}-ffmpeg-corresponding-source-windows-x64-8.1.2.tar.xz"

      - name: Upload Windows corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: watchalong-ffmpeg-source-windows
          path: ${{ runner.temp }}/ffmpeg-source-assets/*.tar.xz
          if-no-files-found: error
          compression-level: 0

  macos-source-bundle:
    name: Build macOS FFmpeg source bundle
    runs-on: ubuntu-latest
    needs: validate-version
    permissions:
      contents: read

    steps:
      - name: Check out repository and bundled binaries
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Verify macOS source-bundle inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts/ffmpeg_macos_source_bundle_test.py
          python3 scripts/ffmpeg_macos_source_bundle.py --verify-only

      - name: Assemble macOS FFmpeg corresponding source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ffmpeg-source-assets"
          python3 scripts/ffmpeg_macos_source_bundle.py \
            --cache-dir "${RUNNER_TEMP}/ffmpeg-source-cache" \
            --output "${RUNNER_TEMP}/ffmpeg-source-assets/WatchAlong-${GITHUB_REF_NAME}-ffmpeg-corresponding-source-macos-8.1.2.tar.xz"

      - name: Upload macOS corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: watchalong-ffmpeg-source-macos
          path: ${{ runner.temp }}/ffmpeg-source-assets/*.tar.xz
          if-no-files-found: error
          compression-level: 0

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
      - windows-source-bundle
      - macos-source-bundle
    permissions:
      contents: write

    steps:
      - name: Check out release notices
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Name release artifacts and generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          copy_release_artifact() {
            local source_directory="$1"
            local extension="$2"
            local target="$3"
            local matches=()

            while IFS= read -r -d '' file; do
              matches+=("$file")
            done < <(find "$source_directory" -type f -name "*.${extension}" -print0)

            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one .${extension} in ${source_directory}; found ${#matches[@]}." >&2
              exit 1
            fi

            cp -- "${matches[0]}" "release-assets/WatchAlong-${GITHUB_REF_NAME}-${target}.${extension}"
          }

          copy_release_artifact dist-artifacts/watchalong-windows exe windows-x64
          copy_release_artifact dist-artifacts/watchalong-macos-x64 dmg macos-x64
          copy_release_artifact dist-artifacts/watchalong-macos-arm64 dmg macos-arm64
          cp -- \
            "dist-artifacts/watchalong-ffmpeg-source-macos/WatchAlong-${GITHUB_REF_NAME}-ffmpeg-corresponding-source-macos-8.1.2.tar.xz" \
            "dist-artifacts/watchalong-ffmpeg-source-windows/WatchAlong-${GITHUB_REF_NAME}-ffmpeg-corresponding-source-windows-x64-8.1.2.tar.xz" \
            release-assets/
          cp -- FFMPEG_SOURCE_ACCESS.md release-assets/FFMPEG_SOURCE_ACCESS.md
          cp -- FFMPEG_LGPL_2.1.txt release-assets/FFMPEG_LGPL_2.1.txt
          cp -- THIRD_PARTY_NOTICES.md release-assets/THIRD_PARTY_NOTICES.md
          cp -- TOOL_PROVENANCE.md release-assets/TOOL_PROVENANCE.md

          (
            cd release-assets
            LC_ALL=C sha256sum -- \
              "WatchAlong-${GITHUB_REF_NAME}-windows-x64.exe" \
              "WatchAlong-${GITHUB_REF_NAME}-macos-x64.dmg" \
              "WatchAlong-${GITHUB_REF_NAME}-macos-arm64.dmg" \
              "WatchAlong-${GITHUB_REF_NAME}-ffmpeg-corresponding-source-macos-8.1.2.tar.xz" \
              "WatchAlong-${GITHUB_REF_NAME}-ffmpeg-corresponding-source-windows-x64-8.1.2.tar.xz" \
              FFMPEG_SOURCE_ACCESS.md \
              FFMPEG_LGPL_2.1.txt \
              THIRD_PARTY_NOTICES.md \
              TOOL_PROVENANCE.md \
              > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.tar.xz
            release-assets/SHA256SUMS.txt
            release-assets/FFMPEG_SOURCE_ACCESS.md
            release-assets/FFMPEG_LGPL_2.1.txt
            release-assets/THIRD_PARTY_NOTICES.md
            release-assets/TOOL_PROVENANCE.md
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
